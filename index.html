```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Terminal</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #020504;
    color: #00ff66;
    font-family: monospace;
    padding: 20px;
    overflow-x: hidden;
}

h1 {
    color: #ff2020;
    text-align: center;
    text-shadow: 0 0 15px red;
}

.panel {
    border: 1px solid #00ff66;
    padding: 18px;
    box-shadow: 0 0 18px #00ff6644;
    border-radius: 8px;
}

.status {
    color: #ff3030;
    animation: blink 0.8s infinite;
    text-align: center;
}

@keyframes blink {
    50% { opacity: 0.25; }
}

#logs {
    height: 220px;
    overflow: hidden;
    font-size: 13px;
    line-height: 1.8;
    overflow-wrap: anywhere;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    background: #00ff66;
    border: 0;
    font-weight: bold;
    font-size: 17px;
    cursor: pointer;
}

#result {
    text-align: center;
    margin-top: 20px;
    color: yellow;
    font-size: 20px;
}

small {
    color: #aaa;
}
</style>
</head>

<body>

<h1>⚠ CYBER TERMINAL ⚠</h1>

<div class="panel">
    <p class="status">● SIMULATED SECURITY ALERT</p>
    <p>System: VISUAL DEMO</p>
    <p>Network: DEMONSTRATION ONLY</p>
    <hr style="border-color:#00ff66">

    <div id="logs">
        > Terminal initialized...<br>
        > Waiting for user...
    </div>

    <button onclick="startDemo()">START SIMULATION</button>

    <div id="result"></div>
</div>

<p style="text-align:center">
    <small>For entertainment only — no device access.</small>
</p>

<script>
const messages = [
    "> Initializing visual scanner...",
    "> Checking simulated network...",
    "> Analyzing demo security logs...",
    "> Loading encrypted-style animation...",
    "> Running fictional diagnostic...",
    "> Preparing final report..."
];

let running = false;

function startDemo() {
    if (running) return;
    running = true;

    const logs = document.getElementById("logs");
    const result = document.getElementById("result");
    const button = document.querySelector("button");

    button.disabled = true;
    button.textContent = "SIMULATION RUNNING...";
    result.textContent = "";

    let i = 0;
    logs.innerHTML = "";

    const timer = setInterval(() => {
        if (i < messages.length) {
            logs.innerHTML += messages[i] + "<br>";
            logs.scrollTop = logs.scrollHeight;
            i++;
        } else {
            clearInterval(timer);
            result.innerHTML =
                "😂 PRANK COMPLETE!<br><br>" +
                "YOUR PHONE IS NOT HACKED.";
            button.disabled = false;
            button.textContent = "RUN AGAIN";
            running = false;
        }
    }, 900);
}
</script>

</body>
</html>
